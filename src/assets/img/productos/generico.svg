<!-- Imagen por defecto para los productos creados desde el Panel de
     Control. Se usa para no tener que subir archivos reales: la rúbrica
     pide justamente omitir esa parte. Es un SVG para que pese casi nada
     y se vea nítido en cualquier tamaño. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="#1e1010"/>
  <circle cx="300" cy="258" r="92" fill="none" stroke="#5c211d" stroke-width="14"/>
  <line x1="366" y1="324" x2="430" y2="388" stroke="#5c211d" stroke-width="18" stroke-linecap="round"/>
  <text x="300" y="440" font-family="Georgia, serif" font-size="38"
        fill="#7a6260" text-anchor="middle">Equipo sin imagen</text>
  <text x="300" y="486" font-family="Georgia, serif" font-size="26"
        fill="#5c4442" text-anchor="middle">VESTIGIO</text>
</svg>
